name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://condopilot:condopilot@localhost:5432/condopilot
  TEST_DATABASE_URL: postgresql://condopilot:condopilot@localhost:5432/condopilot_test
  AUTH_SECRET: ci-only-secret-not-for-production-use
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  LLM_PROVIDER: local

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: condopilot
          POSTGRES_PASSWORD: condopilot
          POSTGRES_DB: condopilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U condopilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency audit (fails only on critical)
        run: npm audit --audit-level=critical

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Create test database
        run: psql "$DATABASE_URL" -c "CREATE DATABASE condopilot_test;"
        env:
          PGPASSWORD: condopilot

      - name: Apply migrations (dev + test databases)
        run: |
          npx prisma migrate deploy
          DATABASE_URL="$TEST_DATABASE_URL" npx prisma db push --skip-generate

      - name: Unit, component and integration tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Seed demo data
        run: npm run db:seed

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
