services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: condopilot
      POSTGRES_PASSWORD: condopilot
      POSTGRES_DB: condopilot
    ports:
      - "55432:5432"
    volumes:
      - condopilot-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U condopilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  condopilot-db:
